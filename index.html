<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Controle WebHub</title>
<script src="js/config.js?v=202609241728"></script>
<script src="js/auth.js?v=202609241728"></script>
<script>AUTH.requireAuth();</script>
<script src="js/theme.js?v=202609241728"></script>
<script src="js/sidebar.js?v=202609241728"></script>
<link rel="stylesheet" href="css/style.css?v=202609241728">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body>

<svg style="display:none">
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c.8-3.4 3-5.2 6-5.2s5.2 1.8 6 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.5" cy="8.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 14.6c2.6.3 4.2 1.9 4.8 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-handshake" viewBox="0 0 24 24"><path d="M2 12l4-4 3 2 3-2 3 2 4-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12v3.5l4 3 3-2m2 0 3 2 4-3V11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="11" height="18" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="15" y="9" width="5" height="12" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="7" y1="7" x2="7" y2="7.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="11" y1="7" x2="11" y2="7.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="7" y1="11" x2="7" y2="11.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="11" y1="11" x2="11" y2="11.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="7" y1="15" x2="7" y2="15.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="11" y1="15" x2="11" y2="15.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 12h3.5a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H16a2 2 0 0 1 0-4z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 12h5l2 3h4l2-3h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 3v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 8l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-report" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 3v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="15.5" x2="15" y2="15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="19" x2="12.5" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 17l5-5-5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="20" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.4-2-3.4-2.3.8a7.7 7.7 0 0 0-1.7-1l-.4-2.4H10.6l-.4 2.4a7.7 7.7 0 0 0-1.7 1l-2.3-.8-2 3.4L6.2 11a7.6 7.6 0 0 0 0 2l-2 1.4 2 3.4 2.3-.8a7.7 7.7 0 0 0 1.7 1l.4 2.4h3.4l.4-2.4a7.7 7.7 0 0 0 1.7-1l2.3.8 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 3.5h3l1.5 3.8-2 1.4a12 12 0 0 0 5.2 5.2l1.4-2 3.8 1.5v3a1.6 1.6 0 0 1-1.7 1.6A15.5 15.5 0 0 1 5 5.2 1.6 1.6 0 0 1 6.6 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17v-5a6 6 0 0 1 12 0v5l1.5 2.2H4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 20.5a2.6 2.6 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="6" y="12" width="3" height="7" fill="currentColor"/><rect x="11" y="7" width="3" height="12" fill="currentColor"/><rect x="16" y="4" width="3" height="15" fill="currentColor"/></symbol>
</svg>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Recolher menu"><svg class="icon-sm"><use href="#i-chevron"/></svg></button>
    <div class="brand">
      <div class="brand-mark">CW</div>
      <span class="brand-name">Controle WebHub</span>
    </div>
    <nav class="nav-group">
      <a href="index.html" class="nav-link active"><svg class="icon"><use href="#i-home"/></svg><span>Dashboard</span></a>
      <a href="clientes.html" class="nav-link"><svg class="icon"><use href="#i-users"/></svg><span>Clientes</span></a>
      <a href="cliente.html" class="nav-sublink"><svg><use href="#i-plus"/></svg><span>Novo cliente</span></a>
      <a href="financeiro.html" class="nav-link"><svg class="icon"><use href="#i-wallet"/></svg><span>Financeiro</span></a>
      <a href="relatorio.html" class="nav-link"><svg class="icon"><use href="#i-report"/></svg><span>Relatório</span></a>
      <a href="configuracoes.html" class="nav-link"><svg class="icon"><use href="#i-gear"/></svg><span>Configurações</span></a>
    </nav>
    <div class="nav-spacer"></div>
    <button class="nav-link nav-logout" id="logoutBtn"><svg class="icon"><use href="#i-logout"/></svg><span>Sair</span></button>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ================= CONTEÚDO ================= -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menu"><svg class="icon"><use href="#i-menu"/></svg></button>
        <h1>Dashboard</h1>
        <span class="topbar-pill" id="clientCountPill">0 clientes</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBell" aria-label="Notificações"><svg class="icon"><use href="#i-bell"/></svg></button>
        <div class="user-chip">
          <div class="user-avatar">EU</div>
          <span>Minha agência</span>
        </div>
      </div>
    </div>

    <!-- ===== Card de estatística principal ===== -->
    <section class="stat-grid">
      <button type="button" class="stat-card is-accent is-clickable" id="statCardFechado">
        <div class="stat-icon"><svg class="icon"><use href="#i-cash"/></svg></div>
        <div>
          <div class="stat-value" id="statTotalFechado">R$ 0,00</div>
          <div class="stat-label">Total de projetos fechados</div>
        </div>
      </button>
    </section>

    <!-- ===== Modal de detalhamento (aberto pelo card acima) ===== -->
    <div class="modal-overlay" id="detailModalOverlay">
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="detailModalTitle">Detalhes</h3>
          <button type="button" class="notif-popup-close modal-close" id="detailModalClose" aria-label="Fechar">×</button>
        </div>
        <div class="modal-body" id="detailModalBody"></div>
      </div>
    </div>

    <!-- ===== Modal do histórico completo de fechamentos por mês ===== -->
    <div class="modal-overlay" id="chartModalOverlay">
      <div class="modal-card is-wide">
        <div class="modal-head">
          <h3>Histórico completo de fechamentos</h3>
          <button type="button" class="notif-popup-close modal-close" id="chartModalClose" aria-label="Fechar">×</button>
        </div>
        <div class="chart-wrap" style="height:360px;"><canvas id="monthlyChartExpanded"></canvas></div>
      </div>
    </div>

    <!-- ===== Gráficos ===== -->
    <section class="grid-2">
      <div class="panel">
        <div class="panel-head">
          <h3>Fechamentos por mês</h3>
          <button type="button" class="plain-link btn-link-reset" id="expandChartBtn">Ver histórico completo</button>
        </div>
        <div class="chart-wrap" id="monthlyChartWrap"><canvas id="monthlyChart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Status dos projetos</h3></div>
        <div class="target-list" id="statusBreakdown"></div>
      </div>
    </section>

    <!-- ===== Clientes recentes ===== -->
    <section style="margin-top:22px;">
      <div class="panel-head">
        <h3>Clientes recentes</h3>
        <a href="clientes.html" class="plain-link">Ver todos</a>
      </div>
      <div class="client-grid" id="recentClients"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="js/store.js?v=202609241728"></script>
<script src="js/notifications.js?v=202609241728"></script>
<script src="js/dashboard.js?v=202609241728"></script>
<script>document.getElementById('logoutBtn').addEventListener('click', () => AUTH.logout());</script>
</body>
</html>
